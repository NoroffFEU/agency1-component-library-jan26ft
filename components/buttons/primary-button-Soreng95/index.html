<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Button</title>
    <link rel="stylesheet" href="main.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="card">
        <h2>Variants</h2>
        <div class="row">
          <button class="btn primary">Primary</button>
          <button class="btn secondary">Secondary</button>
          <button class="btn outline">Outline</button>
          <button class="btn ghost">Ghost</button>
          <button class="btn destructive">Delete</button>
          <button class="btn success">Approve</button>
          <button class="btn link">Link</button>
        </div>
      </div>

      <div class="card">
        <h2>Sizes</h2>
        <div class="row">
          <button class="btn primary small">Small</button>
          <button class="btn primary">Medium</button>
          <button class="btn primary large">Large</button>
        </div>
        <div class="row" style="margin-top: 12px">
          <button class="btn primary full">Full width</button>
        </div>
      </div>

      <div class="card">
        <h2>Loading</h2>
        <div class="row">
          <button
            class="btn primary"
            data-loading-text="Working on it..."
            data-demo-ms="2400"
          >
            <span class="spinner"></span>
            <span class="btn-text">Continue</span>
          </button>

          <button
            class="btn secondary"
            data-loading-text="Processing..."
            data-demo-ms="2200"
          >
            <span class="spinner"></span>
            <span class="btn-text">Save</span>
          </button>

          <button
            class="btn destructive small"
            data-loading-text="Deleting..."
            data-demo-ms="1800"
          >
            <span class="spinner"></span>
            <span class="btn-text">Delete account</span>
          </button>
        </div>
      </div>

      <div class="card">
        <h2>Disabled</h2>
        <div class="row">
          <button class="btn primary" disabled>Primary</button>
          <button class="btn secondary" disabled>Secondary</button>
          <button class="btn outline" disabled>Outline</button>
        </div>
      </div>
    </div>

    <script src="button.js"></script>
  </body>
</html>
