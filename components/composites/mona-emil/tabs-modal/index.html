<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Content Tabs</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="tabs">
        <div class="tabs__nav" role="tablist">
          <button
            class="tabs__button active"
            data-tab="overview"
            aria-selected="true"
            aria-controls="tab-overview"
          >
            Overview
          </button>
          <button
            class="tabs__button"
            data-tab="details"
            aria-selected="false"
            aria-controls="tab-details"
          >
            Details
          </button>
          <button
            class="tabs__button"
            data-tab="specifications"
            aria-selected="false"
            aria-controls="tab-specifications"
          >
            Specifications
          </button>
        </div>

        <div class="tabs__panels">
          <div class="tabs__panel active" id="tab-overview" role="tabpanel">
            <h3>Overview</h3>
            <p>Product description...</p>
            <button
              class="tabs__modal-trigger"
              data-modal-title="Overview"
              data-modal-text="An everyday travel backpack made for short trips and long workdays. The main compartment fits a 15 inch laptop, and the front pocket keeps chargers and keys within reach."
            >
              View More
            </button>
          </div>
          <div class="tabs__panel" id="tab-details" role="tabpanel">
            <h3>Details</h3>
            <p>Product details...</p>
            <button
              class="tabs__modal-trigger"
              data-modal-title="Details"
              data-modal-text="Water resistant recycled polyester with a padded back panel and adjustable straps. Comes in black, sand and forest green, and ships with a two year warranty."
            >
              View More
            </button>
          </div>
          <div class="tabs__panel" id="tab-specifications" role="tabpanel">
            <h3>Specifications</h3>
            <p>Customer specifications...</p>
            <button
              class="tabs__modal-trigger"
              data-modal-title="Specifications"
              data-modal-text="Volume: 22 litres. Weight: 780 grams. Dimensions: 46 x 30 x 15 cm. Laptop sleeve: up to 15 inches. Materials: 600D recycled polyester with YKK zippers."
            >
              View More
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="modal-overlay" id="modalOverlay">
      <div
        class="modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modalTitle"
      >
        <h2 class="modal__title" id="modalTitle"></h2>
        <p class="modal__text" id="modalText"></p>
        <button class="modal__close" id="closeModal">Close</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
