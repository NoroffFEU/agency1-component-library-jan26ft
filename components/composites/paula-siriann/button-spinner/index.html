<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Button with Spinner</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="balloons" aria-hidden="true">
      <span class="balloon balloon--1">🎈</span>
      <span class="balloon balloon--2">🎈</span>
      <span class="balloon balloon--3">🎈</span>
      <span class="balloon balloon--4">🎈</span>
      <span class="balloon balloon--5">🎈</span>
      <span class="balloon balloon--6">🎈</span>
      <span class="balloon balloon--7">🎈</span>
      <span class="balloon balloon--8">🎈</span>
    </div>

    <form class="birthday-form">
      <h1>Send a Birthday Message!</h1>

      <label for="fromName">From</label>
      <input type="text" id="fromName" placeholder="Your name" />

      <label for="toName">To</label>
      <input type="text" id="toName" placeholder="Recipient's name" />

      <label for="toEmail">Recipient's Email</label>
      <input type="email" id="toEmail" placeholder="recipient@email.com" />

      <label for="message">Message</label>
      <textarea
        id="message"
        placeholder="Write your birthday message..."
      ></textarea>

      <button type="submit" class="send-btn">
        <span class="btn__label btn__label--send">Send</span>
        <span class="btn__label btn__label--done">Sent!</span>
        <span class="btn__spinner" role="status" aria-label="Loading"></span>
      </button>
    </form>
  </body>
</html>
