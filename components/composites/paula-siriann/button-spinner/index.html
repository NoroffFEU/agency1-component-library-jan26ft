<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Button with Spinner</title>
<link rel="stylesheet" href="style.css">
<script src="script.js" defer></script>
</head>
<body>
    <form class="birthday-form">
        <h1>Send a Birthday Message!</h1>

        <label for="fromName">From</label>
        <input type="text" id="fromName" placeholder="Your name">

        <label for="toName">To</label>
        <input type="text" id="toName" placeholder="Recipient's name">

        <label for="toEmail">Recipient's Email</label>
        <input type="email" id="toEmail" placeholder="recipient@email.com">

        <label for="message">Message</label>
        <textarea id="message" placeholder="Write your birthday message..."></textarea>

        <button type="submit" class="send-btn">
            <span class="btn__label">Send</span>
        </button>
    </form>

</body>
</html>
