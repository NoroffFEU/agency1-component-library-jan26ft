<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navbar + Dropdown</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
  <script src="https://kit.fontawesome.com/8d67182890.js" crossorigin="anonymous"></script>
</head>
<body>
  <header class="header">
    <span class="logo">
      Sweet Brew
    </span>

    <nav class="navbar">
      <button class="menu-toggle" id="navToggle" aria-label="Open menu">
        <i class="fa-solid fa-bars"></i>
      </button>

        <ul class="nav-menu" id="navMenu">
          <li>
            <button class="dropdown-btn">Coffee</button></li> <!-- suggestions: coffee types -->
          <li>
            <button class="dropdown-btn">Bread</button></li> <!-- suggestions: sourdough, focaccia, ect.-->
          <li>
            <button class="dropdown-btn">Pastry</button></li> <!-- suggestions: croissant, cinnamon roll ect. -->
          <li>
            <button class="dropdown-btn">Cake</button></li> <!-- suggestions: chocolate cake, carrot cake ect. -->
        </ul>
    </nav>
  </header>

  <main class="content">
    <h1>Café</h1>
    <p>Browse trough the menu</p>
    
  </main>
</body>
</html>
