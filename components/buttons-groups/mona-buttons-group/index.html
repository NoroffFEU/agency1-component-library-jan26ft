<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Button Group</title>
  <script src="script.js" defer></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
<!-- Button group -->
    <div class="button-group">
      <button class="button-group__btn active">Pizza</button>
      <button class="button-group__btn">Pasta</button>
      <button class="button-group__btn">Burger</button>
      <button class="button-group__btn">Salad</button>
    </div>

    <div class="button-group button-group--secondary button-group--vertical">
      <button class="button-group__btn active">Restaurant</button>
      <button class="button-group__btn">Cafe</button>
      <button class="button-group__btn">Bakery</button>
      <button class="button-group__btn">Store</button>
    </div>
  
</body>
</html>
