<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Member Card</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="card-container">

    <article class="team-card">

      <div class="team-card__avatar">
        SG
      </div>

      <div class="team-card__content">
        <p class="team-card__label">Meet the team</p>

        <h2 class="team-card__name">Stephanie Gulaker</h2>

        <p class="team-card__role">Frontend Developer</p>

        <p class="team-card__bio">
          Creating simple and user-friendly digital experiences
          with a focus on clean design and accessibility.
        </p>

        <div class="team-card__skills">
          <span class="team-card__skill">HTML</span>
          <span class="team-card__skill">CSS</span>
          <span class="team-card__skill">JavaScript</span>
        </div>

        <a class="team-card__button" href="#">
          View profile
        </a>
      </div>

    </article>

  </main>
</body>
</html>
