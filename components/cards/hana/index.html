<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glass Effect Card</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="scene">
        <div class="card-grid">

     <div class="card-slot card-slot--aurora">
        <div class="orb orb--1"></div>
        <div class="orb orb--2"></div>
        <div class="orb orb--3"></div>

        <button class="glass-card" type="button" aria-pressed="false">
            <span class="glass-card__inner">

                <span class="glass-card__face glass-card__face--front">
                    <span class="glass-card__row">
                        <span class="glass-card__chip"></span>
                        <span class="glass-card__brand">Aurora Credit Card</span>
                    </span>
                

                 <span class="glass-card__number">1234 5678 9012 3456</span>

                 <span class="glass-card__row glass-card__row--bottom">
                    <span class="glass-card__field">
                        <span class="glass-card__label">Card Holder</span>
                        <span class="glass-card__value">Example Name</span>
                    </span>
                    <span class="glass-card__field">
                        <span class="glass-card__label">Valid thru</span>
                        <span class="glass-card__value">12/34</span>
                    </span>
                </span>
            </span>

            <span class="glass-card__face glass-card__face--back">
                <span class="glass-card__stripe"></span>
                <span class="glass-card__signature">
                    <span class="glass-card__signature-strip"></span>
                    <span class="glass-card__cvv">123</span>
                </span>
                <span class="glass-card__smallprint">
                    This card is a design demo. Not a real payment card.
                </span>
            </span>

            </span>
        </button>
    </div>

    <div class="card-slot card-slot--ocean">
        <div class="orb orb--1"></div>
        <div class="orb orb--2"></div>
        <div class="orb orb--3"></div>

        <button class="glass-card" type="button" aria-pressed="false">
            <span class="glass-card__inner">

                <span class="glass-card__face glass-card__face--front">
                    <span class="glass-card__row">
                        <span class="glass-card__chip"></span>
                        <span class="glass-card__brand">Ocean Credit Card</span>
                    </span>
                

                 <span class="glass-card__number">7889 9065 3456 2340</span>

                 <span class="glass-card__row glass-card__row--bottom">
                    <span class="glass-card__field">
                        <span class="glass-card__label">Card Holder</span>
                        <span class="glass-card__value">Example Name</span>
                    </span>
                    <span class="glass-card__field">
                        <span class="glass-card__label">Valid thru</span>
                        <span class="glass-card__value">08/38</span>
                    </span>
                </span>
            </span>

            <span class="glass-card__face glass-card__face--back">
                <span class="glass-card__stripe"></span>
                <span class="glass-card__signature">
                    <span class="glass-card__signature-strip"></span>
                    <span class="glass-card__cvv">567</span>
                </span>
                <span class="glass-card__smallprint">
                    This card is a design demo. Not a real payment card.
                </span>
            </span>

            </span>
        </button>
    </div>

    <div class="card-slot card-slot--citrus">
        <div class="orb orb--1"></div>
        <div class="orb orb--2"></div>
        <div class="orb orb--3"></div>

        <button class="glass-card" type="button" aria-pressed="false">
            <span class="glass-card__inner">

                <span class="glass-card__face glass-card__face--front">
                    <span class="glass-card__row">
                        <span class="glass-card__chip"></span>
                        <span class="glass-card__brand">Citrus Credit Card</span>
                    </span>
                

                 <span class="glass-card__number">2345 5600 4899 3588</span>

                 <span class="glass-card__row glass-card__row--bottom">
                    <span class="glass-card__field">
                        <span class="glass-card__label">Card Holder</span>
                        <span class="glass-card__value">Example Name</span>
                    </span>
                    <span class="glass-card__field">
                        <span class="glass-card__label">Valid thru</span>
                        <span class="glass-card__value">05/48</span>
                    </span>
                </span>
            </span>

            <span class="glass-card__face glass-card__face--back">
                <span class="glass-card__stripe"></span>
                <span class="glass-card__signature">
                    <span class="glass-card__signature-strip"></span>
                    <span class="glass-card__cvv">233</span>
                </span>
                <span class="glass-card__smallprint">
                    This card is a design demo. Not a real payment card.
                </span>
            </span>

            </span>
        </button>
    </div>
        </div>
</main>
    
    <script src="script.js"></script>
</body>
</html>
