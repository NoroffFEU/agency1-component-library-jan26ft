<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>STØY / 26 — 404 Agency</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Mono&family=Oswald:wght@400;700&family=Space+Grotesk:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="js/lineup.js" defer></script>
    <script src="js/tickets.js" defer></script>
    <script src="js/marquee.js" defer></script>
    <script src="js/faq.js" defer></script>
  </head>
  <body>
    <!-- ══════ SECTION 1 · HERO (Stephanie) ══════ -->
    <section class="hero"></section>

    <!-- ══════ SECTION 2 · LINEUP (Paula) ══════ -->
    <section class="lineup"></section>

    <!-- ══════ SECTION 3 · TICKETS (Victoria) ══════ -->
    <section class="tickets"></section>

    <!-- ══════ SECTION 4 · SPONSORS MARQUEE (Stephanie) ══════ -->
    <section class="sponsors"></section>

    <!-- ══════ SECTION 5 · FAQ (Trym) ══════ -->
    <section class="faq">
      <div class="faq__inner">
        <p class="faq__eyebrow">QUESTIONS / ANSWERS</p>
        <h2 class="faq__title">GOOD TO KNOW</h2>

        <div class="faq__list">
          <div class="faq__item">
            <button class="faq__question">
              What time do the gates open?
              <span class="faq__icon">+</span>
            </button>

            <div class="faq__answer">
              <p>The festival gates open at 14:00.</p>
            </div>
          </div>

          <div class="faq__item">
            <button class="faq__question">
              Is there an age limit?
              <span class="faq__icon">+</span>
            </button>

            <div class="faq__answer">
              <p>STØY is an 18+ event.</p>
            </div>
          </div>

          <div class="faq__item">
            <button class="faq__question">
              Can I bring food and drinks?
              <span class="faq__icon">+</span>
            </button>

            <div class="faq__answer">
              <p>
                Outside food and drinks are not permitted inside the festival
                area.
              </p>
            </div>
          </div>

          <div class="faq__item">
            <button class="faq__question">
              What happens if it rains?
              <span class="faq__icon">+</span>
            </button>

            <div class="faq__answer">
              <p>
                The festival goes ahead rain or shine, so dress for the weather.
              </p>
            </div>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
